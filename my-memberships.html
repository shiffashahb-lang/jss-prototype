<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Membership — JobSkillShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/buttons-override.css">
</head>
<body>

  <div class="app-shell">

    <aside class="app-sidebar">
      <div class="app-sidebar-header">
        <a href="dashboard.html" class="nav-logo" style="display:flex;align-items:center;gap:8px;">
          <img src="assets/images/logo-full.png" alt="JobSkillShare logo" style="height:24px;">
        </a>
      </div>

      <ul class="app-nav">
        <li class="app-nav-item">
          <a href="dashboard.html">
            <svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
            <span>Progress</span>
          </a>
        </li>
        <li class="app-nav-item active">
          <a href="my-memberships.html">
            <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            <span>Membership</span>
          </a>
        </li>
      </ul>

      <div class="app-sidebar-foot">
        <a href="index.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Back to site</span>
        </a>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <button class="app-icon-btn" title="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="app-icon-btn" title="Help">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
        <div class="app-avatar" title="Your profile">JS</div>
      </header>

      <main class="app-content content-body-flex" style="display:flex; gap:40px;">
        <!-- Left Sub Nav -->
        <nav class="sub-navigation">
          <h2>My Membership</h2>
          <ul class="sub-nav-list">
            <li class="sub-nav-item"><button class="sub-nav-btn active" onclick="switchTab('memberships', this)">My Membership</button></li>
            <li class="sub-nav-item"><button class="sub-nav-btn" onclick="switchTab('invoices', this)">Past Invoices</button></li>
            <li class="sub-nav-item"><button class="sub-nav-btn" onclick="switchTab('account', this)">My Account</button></li>
          </ul>
        </nav>

        <!-- Tab 1: My Membership View -->
        <div id="tab-memberships" class="tab-pane active">
          <div class="info-row">
            <div><strong>Level</strong><span>Free Membership · Three months access</span></div>
            <div><strong>Billing</strong><span>Free</span></div>
            <div><strong>Expiration</strong><span>October 24, 2026</span></div>
          </div>

          <div class="action-buttons">
            <a href="membership-sales.html" class="btn btn-primary">Change plan</a>
            <a href="membership-cancel.html" class="btn btn-outline" style="border-color:var(--coral); color:var(--coral);">Cancel</a>
          </div>

          <a href="membership-sales.html" class="option-link">View all membership options &rarr;</a>
        </div>

        <!-- Tab 2: Past Invoices View -->
        <div id="tab-invoices" class="tab-pane">
          <table class="app-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Level</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>July 24, 2026</td>
                <td>Free Membership · Three months access</td>
                <td>$0.00</td>
                <td><span class="badge-paid">Paid</span></td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Tab 3: My Account View -->
        <div id="tab-account" class="tab-pane">
          <div class="form-group">
            <label>Username</label>
            <input type="text" value="Shiffa" readonly>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" value="shiffashahb@gmail.com" readonly>
          </div>
          <a href="#" style="color:var(--teal-dark); font-weight:600; font-size:.9rem;">Edit profile</a>
        </div>
      </main>
    </div>

  </div>

  <script>
    function switchTab(tabName, btn) {
      document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
      document.querySelectorAll('.sub-nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      btn.classList.add('active');
    }
  </script>

</body>
</html>
