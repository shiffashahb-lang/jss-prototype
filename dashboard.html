<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — JobSkillShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/buttons-override.css">
</head>
<body>

  <div class="app-shell">

    <aside class="app-sidebar">
      <div class="app-sidebar-header">
        <a href="dashboard.html" class="nav-logo" style="display:flex;align-items:center;gap:8px;">
          <img src="assets/images/logo-full.png" alt="JobSkillShare logo" style="height:24px;">
        </a>
      </div>

      <ul class="app-nav">
        <li class="app-nav-item active">
          <a href="dashboard.html">
            <svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
            <span>Progress</span>
          </a>
        </li>
        <li class="app-nav-item">
          <a href="programs.html">
            <svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
            <span>Certificate Programs</span>
          </a>
        </li>
        <li class="app-nav-item">
          <a href="courses.html">
            <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span>Courses</span>
          </a>
        </li>
        <li class="app-nav-item">
          <a href="#">
            <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <span>Practice Labs</span>
          </a>
        </li>
        <li class="app-nav-item">
          <a href="community.html">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Community</span>
          </a>
        </li>
        <li class="app-nav-item">
          <a href="my-memberships.html">
            <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            <span>Membership</span>
          </a>
        </li>
      </ul>

      <div class="app-sidebar-foot">
        <a href="index.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Back to site</span>
        </a>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <button class="app-icon-btn" title="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="app-icon-btn" title="Help">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
        <div class="app-avatar" title="Your profile">JS</div>
      </header>

      <main class="app-content">
        <div class="app-hero">
          <h1>Welcome back — here's your progress</h1>
          <p>Pick up a course, jump into a lab, or keep moving toward your next certificate.</p>
        </div>

        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-num">2</div>
            <div class="stat-label">Total Courses</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">0</div>
            <div class="stat-label">Completed</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">2</div>
            <div class="stat-label">In Progress</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">0</div>
            <div class="stat-label">Certificates</div>
          </div>
        </div>
      </main>
    </div>

  </div>

</body>
</html>
